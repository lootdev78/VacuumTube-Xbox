name: Xbox Debug App

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VacuumTubeXbox/**"
      - "Scripts/**"
      - "Tests/**"
      - "VacuumTubeXbox.sln"
      - "NuGet.config"
      - ".vsconfig"
      - ".github/workflows/xbox-debug-app.yml"
  pull_request:
    paths:
      - "VacuumTubeXbox/**"
      - "Scripts/**"
      - "Tests/**"
      - "VacuumTubeXbox.sln"
      - "NuGet.config"
      - ".vsconfig"
      - ".github/workflows/xbox-debug-app.yml"

permissions:
  contents: read

concurrency:
  group: xbox-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-appx:
    name: Build signed Debug APPX/MSIX (x64)
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      SOLUTION: VacuumTubeXbox.sln
      PROJECT: VacuumTubeXbox\VacuumTubeXbox.csproj
      MANIFEST: VacuumTubeXbox\Package.appxmanifest
      CONFIGURATION: Debug
      PLATFORM: x64
      NUGET_PACKAGES: '${{ github.workspace }}\.nuget\packages'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ env.PLATFORM }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'NuGet.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.PLATFORM }}-
            nuget-${{ runner.os }}-

      - name: Create CI directories
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path artifacts\ci |
            Out-Null

          New-Item -ItemType Directory -Force -Path $env:NUGET_PACKAGES |
            Out-Null

      - name: Record runner toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          @(
            "Runner: $env:ImageOS / $env:ImageVersion"
            "MSBuild: $((Get-Command msbuild).Source)"
            "Node: $(node --version 2>&1)"
            "NuGet packages: $env:NUGET_PACKAGES"
          ) | Tee-Object -FilePath artifacts\ci\toolchain.txt

          msbuild -version |
            Tee-Object -FilePath artifacts\ci\msbuild-version.txt

      - name: Validate JavaScript syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'artifacts\ci\javascript-syntax.log'

          $files = Get-ChildItem `
            -Path VacuumTubeXbox\Assets\ExtensionRuntime, Tests `
            -Recurse `
            -File `
            -Filter *.js |
              Sort-Object FullName

          if (-not $files) {
            throw 'No JavaScript files were found for validation.'
          }

          foreach ($file in $files) {
            "Checking $($file.FullName)" |
              Tee-Object -FilePath $log -Append

            node --check $file.FullName 2>&1 |
              Tee-Object -FilePath $log -Append

            if ($LASTEXITCODE -ne 0) {
              throw "JavaScript syntax validation failed: $($file.FullName)"
            }
          }

      - name: Run Xbox regression tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'artifacts\ci\node-tests.log'

          $tests = @(
            'Tests\xbox-shim.test.js'
            'Tests\feature-refactor.test.js'
          )

          foreach ($test in $tests) {
            if (-not (Test-Path $test)) {
              throw "Required regression test is missing: $test"
            }

            "Running $test" |
              Tee-Object -FilePath $log -Append

            node $test 2>&1 |
              Tee-Object -FilePath $log -Append

            if ($LASTEXITCODE -ne 0) {
              throw "Regression test failed: $test"
            }
          }

      - name: Generate ephemeral signing certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $certificateDirectory = 'VacuumTubeXbox\Certificates'
          $pfxPath = Join-Path $certificateDirectory 'VacuumTubeXbox_Debug.pfx'
          $cerPath = Join-Path $certificateDirectory 'VacuumTubeXbox_Debug.cer'

          New-Item -ItemType Directory -Force -Path $certificateDirectory |
            Out-Null

          $rng = New-Object System.Security.Cryptography.RNGCryptoServiceProvider
          $bytes = New-Object byte[] 32

          try {
            $rng.GetBytes($bytes)
          }
          finally {
            $rng.Dispose()
          }

          $password = [Convert]::ToBase64String($bytes)
          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          Write-Output "::add-mask::$password"

          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=VacuumTube Xbox Debug' `
            -FriendlyName "VacuumTube Xbox CI $env:GITHUB_RUN_ID" `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3') `
            -NotAfter (Get-Date).AddYears(1)

          Export-PfxCertificate `
            -Cert $certificate `
            -FilePath $pfxPath `
            -Password $securePassword `
            -Force |
              Out-Null

          Export-Certificate `
            -Cert $certificate `
            -FilePath $cerPath `
            -Type CERT `
            -Force |
              Out-Null

          $projectPath = (Resolve-Path $env:PROJECT).Path
          $projectXml = Get-Content $projectPath -Raw
          $thumbprintElement = '<PackageCertificateThumbprint>[^<]*</PackageCertificateThumbprint>'
          $replacement = "<PackageCertificateThumbprint>$($certificate.Thumbprint)</PackageCertificateThumbprint>"
          $updatedProjectXml = [regex]::Replace(
            $projectXml,
            $thumbprintElement,
            $replacement,
            1
          )

          if ($updatedProjectXml -eq $projectXml) {
            throw 'PackageCertificateThumbprint was not found in the project file.'
          }

          $utf8WithoutBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            $projectPath,
            $updatedProjectXml,
            $utf8WithoutBom
          )

          "VT_CERT_PASSWORD=$password" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "VT_CERT_THUMBPRINT=$($certificate.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @(
            "Subject: $($certificate.Subject)"
            "Thumbprint: $($certificate.Thumbprint)"
            "NotAfter: $($certificate.NotAfter.ToUniversalTime().ToString('o'))"
            "PFX: $pfxPath"
            "CER: $cerPath"
          ) | Set-Content `
                -Path artifacts\ci\signing-certificate.txt `
                -Encoding utf8

      - name: Compile and package signed Debug APPX/MSIX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'artifacts\ci\msbuild-debug-package.log'

          try {
            & .\Scripts\Build-Debug-MSIX.ps1 `
              -Configuration $env:CONFIGURATION `
              -Platform $env:PLATFORM `
              -CertificatePassword $env:VT_CERT_PASSWORD *>&1 |
                Tee-Object -FilePath $log
          }
          catch {
            $_ | Out-String |
              Tee-Object -FilePath $log -Append
            throw
          }

      - name: Prepare downloadable Debug package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $drop = 'artifacts\GitHubDebugDrop'
          $packageSource = 'AppPackages'
          $publicCertificate = 'VacuumTubeXbox\Certificates\VacuumTubeXbox_Debug.cer'

          if (Test-Path $drop) {
            Remove-Item $drop -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $drop |
            Out-Null

          if (-not (Test-Path $packageSource)) {
            throw 'The AppPackages directory was not created.'
          }

          $packages = Get-ChildItem `
            -Path $packageSource `
            -Recurse `
            -File `
            -Include *.appx,*.msix,*.appxbundle,*.msixbundle

          if (-not $packages) {
            throw 'MSBuild completed, but no APPX/MSIX package was found.'
          }

          Copy-Item `
            $packageSource `
            -Destination $drop\AppPackages `
            -Recurse `
            -Force

          if (-not (Test-Path $publicCertificate)) {
            throw 'The public CI development certificate was not generated.'
          }

          Copy-Item `
            $publicCertificate `
            -Destination $drop `
            -Force

          $symbolSource = "VacuumTubeXbox\bin\$env:PLATFORM\$env:CONFIGURATION"

          if (Test-Path $symbolSource) {
            $symbols = Get-ChildItem `
              -Path $symbolSource `
              -Recurse `
              -File `
              -Filter *.pdb

            if ($symbols) {
              New-Item -ItemType Directory -Force -Path $drop\Symbols |
                Out-Null

              $symbols | ForEach-Object {
                Copy-Item `
                  $_.FullName `
                  -Destination $drop\Symbols `
                  -Force
              }
            }
          }

          $forbiddenFiles = Get-ChildItem `
            -Path $drop `
            -Recurse `
            -File `
            -Include *.pfx,*.pvk,*.key,*.pem `
            -ErrorAction SilentlyContinue

          if ($forbiddenFiles) {
            $forbiddenFiles | ForEach-Object {
              Write-Error "Private signing material detected: $($_.FullName)"
            }

            throw 'Private signing material detected in the upload directory.'
          }

          [xml]$manifest = Get-Content $env:MANIFEST
          $namespace = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $namespace.AddNamespace(
            'appx',
            'http://schemas.microsoft.com/appx/manifest/foundation/windows10'
          )
          $identity = $manifest.SelectSingleNode(
            '/appx:Package/appx:Identity',
            $namespace
          )

          if (-not $identity) {
            throw 'Package identity was not found in Package.appxmanifest.'
          }

          $packageVersion = $identity.Version
          "PACKAGE_VERSION=$packageVersion" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $resolvedDrop = (Resolve-Path $drop).Path
          $hashFiles = Get-ChildItem $drop -Recurse -File |
            Where-Object {
              $_.Extension -in @(
                '.appx',
                '.msix',
                '.appxbundle',
                '.msixbundle',
                '.appxsym',
                '.cer',
                '.pdb'
              )
            } |
              Sort-Object FullName

          $hashLines = foreach ($file in $hashFiles) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file.FullName
            $relative = $file.FullName.Substring($resolvedDrop.Length + 1)
            "$($hash.Hash.ToLowerInvariant())  $relative"
          }

          $hashLines |
            Set-Content `
              -Encoding utf8 `
              "$drop\SHA256SUMS.txt"

          @(
            '### VacuumTube Xbox Debug build'
            ''
            "- Version: **$packageVersion**"
            "- Configuration: **$env:CONFIGURATION**"
            "- Platform: **$env:PLATFORM**"
            '- Package: signed development APPX/MSIX'
            '- Public certificate included: **yes**'
            '- Private signing key included: **no**'
            '- Node regression tests: **passed**'
          ) | Out-File `
                $env:GITHUB_STEP_SUMMARY `
                -Append `
                -Encoding utf8

      - name: Upload Debug app
        uses: actions/upload-artifact@v7
        with:
          name: VacuumTube-Xbox-Debug-${{ env.PACKAGE_VERSION }}-x64
          path: |
            artifacts/GitHubDebugDrop/**
            !artifacts/GitHubDebugDrop/**/*.pfx
            !artifacts/GitHubDebugDrop/**/*.pvk
            !artifacts/GitHubDebugDrop/**/*.key
            !artifacts/GitHubDebugDrop/**/*.pem
          if-no-files-found: error
          retention-days: 14

      - name: Remove private signing key
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Remove-Item `
            VacuumTubeXbox\Certificates\VacuumTubeXbox_Debug.pfx `
            -Force `
            -ErrorAction SilentlyContinue

          if ($env:VT_CERT_THUMBPRINT) {
            Remove-Item `
              "Cert:\CurrentUser\My\$env:VT_CERT_THUMBPRINT" `
              -Force `
              -ErrorAction SilentlyContinue
          }

          $privateKeys = Get-ChildItem `
            -Path artifacts `
            -Recurse `
            -File `
            -Include *.pfx,*.pvk,*.key,*.pem `
            -ErrorAction SilentlyContinue

          if ($privateKeys) {
            $privateKeys | ForEach-Object {
              Write-Error "Private signing material remains in artifacts: $($_.FullName)"
            }

            exit 1
          }

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VacuumTube-Xbox-CI-logs-${{ github.run_number }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
