name: Xbox Debug App

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VacuumTube.Xbox/**"
      - "src/**"
      - "locale/**"
      - "tools/**"
      - "VacuumTube.Xbox.sln"
      - ".github/workflows/xbox-debug-app.yml"
  pull_request:
    paths:
      - "VacuumTube.Xbox/**"
      - "src/**"
      - "locale/**"
      - "tools/**"
      - "VacuumTube.Xbox.sln"
      - ".github/workflows/xbox-debug-app.yml"

permissions:
  contents: read

concurrency:
  group: xbox-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-appx:
    name: Build signed Debug APPX (x64)
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      SOLUTION: VacuumTube.Xbox.sln
      CONFIGURATION: Debug
      PLATFORM: x64
      # Keep the NuGet cache in the workspace; generated directories are ignored
      # by the project validator and are never uploaded as build artifacts.
      NUGET_PACKAGES: '${{ github.workspace }}\.nuget\packages'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Create CI directories
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path artifacts\ci |
            Out-Null

          New-Item -ItemType Directory -Force -Path $env:NUGET_PACKAGES |
            Out-Null

      - name: Record runner toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          @(
            "Runner: $env:ImageOS / $env:ImageVersion"
            "MSBuild: $((Get-Command msbuild).Source)"
            "Python: $(python --version 2>&1)"
            "Node: $(node --version 2>&1)"
            "NuGet packages: $env:NUGET_PACKAGES"
          ) | Tee-Object -FilePath artifacts\ci\toolchain.txt

          msbuild -version |
            Tee-Object -FilePath artifacts\ci\msbuild-version.txt

      - name: Build JavaScript bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          python tools\build_bundle.py 2>&1 |
            Tee-Object artifacts\ci\build-bundle.log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Analyze mods
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          python tools\analyze_mods.py 2>&1 |
            Tee-Object artifacts\ci\analyze-mods.log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Validate project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          python tools\validate_project.py 2>&1 |
            Tee-Object artifacts\ci\validate-project.log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Test SponsorBlock adapter
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          node tools\test_sponsorblock_adapter.js 2>&1 |
            Tee-Object artifacts\ci\sponsorblock.log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Validate JavaScript syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          node --check VacuumTube.Xbox\Web\vacuumtube.bundle.js

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Get-ChildItem src -Recurse -File -Filter *.js |
            ForEach-Object {
              node --check $_.FullName

              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }

      - name: Restore NuGet packages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          msbuild $env:SOLUTION `
            /t:Restore `
            /m `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:RestorePackagesPath="$env:NUGET_PACKAGES" `
            /verbosity:minimal 2>&1 |
              Tee-Object artifacts\ci\nuget-restore.log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Generate ephemeral signing password
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $rng = New-Object System.Security.Cryptography.RNGCryptoServiceProvider
          $bytes = New-Object byte[] 32

          try {
            $rng.GetBytes($bytes)
          }
          finally {
            $rng.Dispose()
          }

          $password = [Convert]::ToBase64String($bytes)

          Write-Output "::add-mask::$password"

          "VT_CERT_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Compile and package signed Debug APPX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          .\tools\Build-Xbox.ps1 `
            -Configuration $env:CONFIGURATION `
            -Platform $env:PLATFORM `
            -Package `
            -GenerateTestCertificate `
            -CertificatePassword $env:VT_CERT_PASSWORD `
            -NoRestore 2>&1 |
              Tee-Object artifacts\ci\msbuild-debug-package.log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Remove private signing key
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Explicitly remove the temporary private key. Only the public .cer
          # and the already signed package are published.
          Remove-Item artifacts\*.pfx -Force -ErrorAction SilentlyContinue

          $privateKeys = Get-ChildItem `
            -Path artifacts `
            -Recurse `
            -File `
            -Include *.pfx,*.pvk,*.key,*.pem `
            -ErrorAction SilentlyContinue

          if ($privateKeys) {
            $privateKeys | ForEach-Object {
              Write-Error "Private signing material remains: $($_.FullName)"
            }

            throw 'Private signing material remains in artifacts.'
          }

      - name: Prepare downloadable Debug package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $drop = 'artifacts\GitHubDebugDrop'
          $packageSource = 'artifacts\AppxPackages'
          $publicCertificate = 'artifacts\VacuumTube-Xbox-Development.cer'

          if (Test-Path $drop) {
            Remove-Item $drop -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $drop |
            Out-Null

          if (-not (Test-Path $packageSource)) {
            throw 'APPX/MSIX package directory was not created.'
          }

          $packages = Get-ChildItem `
            -Path $packageSource `
            -Recurse `
            -File `
            -Include *.appx,*.msix,*.appxbundle,*.msixbundle

          if (-not $packages) {
            throw 'MSBuild completed, but no APPX/MSIX package was found.'
          }

          Copy-Item `
            $packageSource `
            -Destination $drop\AppxPackages `
            -Recurse `
            -Force

          if (-not (Test-Path $publicCertificate)) {
            throw 'The public development certificate was not generated.'
          }

          Copy-Item `
            $publicCertificate `
            -Destination $drop `
            -Force

          if (Test-Path VacuumTube.Xbox\bin\x64\Debug) {
            New-Item `
              -ItemType Directory `
              -Force `
              -Path $drop\Symbols |
                Out-Null

            Get-ChildItem `
              VacuumTube.Xbox\bin\x64\Debug `
              -Recurse `
              -File `
              -Filter *.pdb |
                ForEach-Object {
                  Copy-Item `
                    $_.FullName `
                    -Destination $drop\Symbols `
                    -Force
                }
          }

          $forbiddenFiles = Get-ChildItem `
            -Path $drop `
            -Recurse `
            -File `
            -Include *.pfx,*.pvk,*.key,*.pem `
            -ErrorAction SilentlyContinue

          if ($forbiddenFiles) {
            throw 'Private signing material detected in the upload directory.'
          }

          $resolvedDrop = (Resolve-Path $drop).Path
          $hashFiles = Get-ChildItem $drop -Recurse -File |
            Where-Object {
              $_.Extension -in @(
                '.appx',
                '.msix',
                '.appxbundle',
                '.msixbundle',
                '.cer',
                '.pdb'
              )
            }

          $hashLines = foreach ($file in $hashFiles) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file.FullName
            $relative = $file.FullName.Substring($resolvedDrop.Length + 1)
            "$($hash.Hash.ToLowerInvariant())  $relative"
          }

          $hashLines |
            Set-Content `
              -Encoding utf8 `
              "$drop\SHA256SUMS.txt"

          @(
            '### VacuumTube Xbox Debug build'
            ''
            "- Configuration: **$env:CONFIGURATION**"
            "- Platform: **$env:PLATFORM**"
            '- Package: signed development APPX/MSIX'
            '- Public certificate included: **yes**'
            '- Existing certificate or license required: **no**'
            '- Private signing key included: **no**'
          ) | Out-File `
                $env:GITHUB_STEP_SUMMARY `
                -Append `
                -Encoding utf8

      - name: Upload Debug app
        uses: actions/upload-artifact@v7
        with:
          name: VacuumTube-Xbox-Debug-x64
          path: |
            artifacts/GitHubDebugDrop/**
            !artifacts/GitHubDebugDrop/**/*.pfx
            !artifacts/GitHubDebugDrop/**/*.pvk
            !artifacts/GitHubDebugDrop/**/*.key
            !artifacts/GitHubDebugDrop/**/*.pem
          if-no-files-found: error
          retention-days: 14

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VacuumTube-Xbox-CI-logs-${{ github.run_number }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
